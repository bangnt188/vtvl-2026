name: Validate VTVL preflight
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check modules
        run: |
          node --check public/validation-rules.mjs
          node --check public/xlsx-browser.mjs
          node --check public/validator-ui.mjs
      - name: Regression tests
        run: node --test tests/*.test.mjs
